name: test

# On both hosts, because they start a process group differently: Linux has
# `setsid`, macOS has none and uses the perl shim. Weekly as well, because
# what the tests check can break with no change here: a new runner image, a
# new Dart SDK, a macOS without perl.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test
